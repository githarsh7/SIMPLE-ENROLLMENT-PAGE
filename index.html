<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development Workshop</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="main-container">

        <!-- TITLE -->

        <div class="title">

            <h1>
                Web <span>Development</span> Workshop
            </h1>

            <p>
                Number of available seats : 28
            </p>

        </div>

        <!-- CONTENT -->

        <div class="content">

            <!-- LEFT IMAGE -->

            <div class="left">

                <img src="webdev.jpg" alt="Workshop Image">

            </div>

            <!-- RIGHT FORM -->

            <div class="right">

                <form>

                    <!-- USERNAME -->

                    <div class="input-box">

                        <div class="icon">
                            <i class="fa-regular fa-user"></i>
                        </div>

                        <input
                        type="text"
                        placeholder="Enter Username"
                        required>

                    </div>

                    <!-- EMAIL -->

                    <div class="input-box">

                        <div class="icon">
                            <i class="fa-regular fa-envelope"></i>
                        </div>

                        <input
                        type="email"
                        placeholder="Enter Email"
                        required>

                    </div>

                    <!-- PHONE -->

                    <div class="input-box">

                        <div class="icon">
                            <i class="fa-solid fa-phone"></i>
                        </div>

                        <input
                        type="tel"
                        placeholder="Enter Phone Number"
                        required>

                    </div>

                    <!-- SEATS -->

                    <div class="input-box">

                        <div class="icon">
                            <i class="fa-solid fa-check"></i>
                        </div>

                        <select required>

                            <option value="" disabled selected>
                                Choose no of seats
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>

                        </select>

                    </div>

                    <!-- SECOND USERNAME -->

                    <div class="input-box">

                        <div class="icon">
                            <i class="fa-solid fa-user-plus"></i>
                        </div>

                        <input
                        type="text"
                        placeholder="Second Username"
                        required>

                    </div>

                    <!-- BUTTONS -->

                    <div class="btns">

                        <button type="submit" class="submit-btn">
                            Submit
                        </button>

                        <button type="reset" class="cancel-btn">
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
